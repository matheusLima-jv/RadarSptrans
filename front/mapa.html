<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Localização de Veículos</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        html, body {
            margin: 0;
            height: 100%;
            font-family: system-ui, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        #painel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            width: min(320px, calc(100vw - 20px));
            box-sizing: border-box;
            padding: 12px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        #form-busca {
            display: flex;
            gap: 6px;
        }

        #form-busca input {
            flex: 1;
            min-width: 0;
            padding: 6px;
        }

        #linhas {
            list-style: none;
            margin: 8px 0 0;
            padding: 0;
            max-height: 40vh;
            overflow-y: auto;
        }

        #linhas button {
            width: 100%;
            padding: 6px;
            margin-top: 4px;
            text-align: left;
            background: #f4f4f4;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
        }

        #linhas button.ativa {
            background: #dbeafe;
            border-color: #60a5fa;
        }

        #status {
            margin: 8px 0 0;
            font-size: 0.85em;
            color: #555;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div id="painel">
        <form id="form-busca">
            <input id="termo" type="search" placeholder="Linha ou destino (ex.: 8000, Lapa)" required>
            <button type="submit">Buscar</button>
        </form>
        <ul id="linhas"></ul>
        <p id="status" aria-live="polite"></p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="mapa.js"></script>
</body>
</html>
