spring.application.name=RadarSPT

sptrans.api.url=https://api.olhovivo.sptrans.com.br/v2.1
sptrans.api.token=${SPTRANS_API_TOKEN:}
# Tempo máximo de reuso do cookie de sessão; um 401 da SPTrans força novo login antes disso.
sptrans.api.session-ttl=PT20M
sptrans.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500

# GTFS público da SPTrans: itinerários completos, paradas e frequências programadas.
sptrans.gtfs.enabled=true
sptrans.gtfs.url=https://www.sptrans.com.br/umbraco/Surface/PerfilDesenvolvedor/BaixarGTFS
sptrans.gtfs.atualizacao-cron=0 30 4 * * *

spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=10000

server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info,caches
management.endpoint.health.show-details=never
