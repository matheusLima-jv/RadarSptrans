<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f766e">
    <title>Radar SPTrans</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
<div id="app">
    <aside id="painel">
        <header class="topo">
            <h1>Radar SPTrans</h1>
            <p>Encontre o ônibus que vai passar perto de você</p>
        </header>

        <!-- Etapa 1: escolher linha e destino -->
        <section id="etapa-busca" aria-labelledby="titulo-busca">
            <h2 id="titulo-busca" class="etapa"><span class="numero">1</span> Qual linha?</h2>
            <form id="form-busca" role="search">
                <label for="termo" class="sr-only">Número ou nome da linha</label>
                <input id="termo" type="search" placeholder="Ex.: 848L, 8000, Lapa" autocomplete="off"
                       enterkeyhint="search">
                <button type="submit">Buscar</button>
            </form>
            <div id="resultados" aria-live="polite"></div>
        </section>

        <!-- Etapa 2 e 3: localização e rastreio -->
        <section id="etapa-rastreio" hidden>
            <div class="linha-escolhida">
                <span id="letreiro" class="letreiro"></span>
                <div class="sentido">
                    <div class="para">para <strong id="destino"></strong></div>
                    <div class="de">saindo de <span id="origem"></span></div>
                </div>
                <button id="trocar-linha" type="button" class="botao-link">Trocar</button>
            </div>

            <div id="card-local" class="card">
                <h2 class="etapa"><span class="numero">2</span> Onde você está?</h2>
                <p class="nota">Toque no mapa para marcar sua posição, ou use o GPS.</p>
                <button id="usar-gps" type="button" class="botao-secundario">Usar minha localização</button>
            </div>

            <div id="card-rastreio" class="card destaque" aria-live="polite" hidden></div>
            <div id="card-proximos" class="card" hidden></div>
            <p id="info-linha" class="nota"></p>

            <footer class="rodape">
                <span id="contador" aria-hidden="true"></span>
                <button id="atualizar" type="button" class="botao-link">Atualizar agora</button>
            </footer>
        </section>
    </aside>

    <main id="mapa" aria-label="Mapa"></main>
</div>

<div id="aviso" role="status" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="app.js"></script>
</body>
</html>
